name: Release

# Manual only: a release (and anything published) needs someone to start this workflow. With
# dry_run (the default) everything is built and checked and uploaded as a workflow artifact, but
# no tag, GitHub release, attestation or changelog commit is made. Nothing is ever published to
# Flathub.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Use go.mod's toolchain line (see ci.yml).
  GOTOOLCHAIN: auto
  # semantic-release and its plugins, locked in .github/release/package-lock.json.
  SEMANTIC_RELEASE: .github/release/node_modules/.bin/semantic-release

jobs:
  version:
    name: Next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release checks push access even in a dry run
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A previous release tag exists
        # Without one semantic-release starts again at 1.0.0.
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "::error::No v* tag found. Tag the last release first (git tag v0.2.0 badf9c8 && git push origin v0.2.0)."
            exit 1
          fi
          echo "Last release: $last" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release
      - id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: next-version-dry-run # see verifyReleaseCmd in .releaserc.json
        run: |
          out=$("$SEMANTIC_RELEASE" --dry-run --no-ci 2>&1 || true)
          echo "$out" | tail -20
          v=$(echo "$out" | sed -n 's/.*The next release version is \([0-9][0-9A-Za-z.+-]*\).*/\1/p' | head -1)
          if [ -z "$v" ]; then echo "No release is due (no feat/fix commits since the last tag)."; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Next release: v$v (dry run: ${{ inputs.dry_run }})" | tee -a "$GITHUB_STEP_SUMMARY"

  flatpak:
    name: Flatpak
    needs: version
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Build, then (unless dry run) attest and publish
    needs: [version, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # tag, GitHub release, changelog commit
      id-token: write     # Sigstore keyless signing for attestations
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release pushes with GITHUB_TOKEN itself; nothing else needs the token.
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from a clean cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-*
          path: flatpak-dist
          merge-multiple: true
      - name: Tests
        run: go test -race -count=1 ./...
      # The build runs without GITHUB_TOKEN in its environment, in dry runs and real ones alike.
      - name: Build
        run: ./scripts/build-release.sh "$VERSION"
      - name: Check the release was built for the expected version
        run: ls dist/*_"${VERSION}"_* >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.version.outputs.version }}
          path: dist/
          if-no-files-found: error
      # Attest before publishing, so a release never goes out without provenance.
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/sha256sums.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !inputs.dry_run }}
        with:
          node-version: 22
      - name: Publish with semantic-release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .releaserc.json refuses to publish if its version differs from the one built above.
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release
          "$SEMANTIC_RELEASE"

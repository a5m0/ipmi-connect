name: Flatpak

# Builds, installs and smoke-tests the Flatpak on x86_64 and aarch64 (native runners, no
# emulation). Called by CI and by the release workflow; publishes nothing.
on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the binary
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Embed the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in (*[!0-9A-Za-z.+-]*|'') echo "bad version: $VERSION"; exit 1;; esac
          sed -i "s/^    IPMI_CONNECT_VERSION: .*/    IPMI_CONNECT_VERSION: ${VERSION}/" packaging/flatpak/io.github.a5m0.IPMIConnect.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: ipmi-connect_${{ inputs.version }}_linux_${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.a5m0.IPMIConnect.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*') }}
          upload-artifact: false
      - name: Install and smoke test
        run: |
          flatpak install --user -y --noninteractive --bundle ipmi-connect_${{ inputs.version }}_linux_${{ matrix.arch }}.flatpak
          mkdir -p /run/dbus && (dbus-daemon --system --fork || true)
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- packaging/flatpak/smoke-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: ipmi-connect_${{ inputs.version }}_linux_${{ matrix.arch }}.flatpak
          if-no-files-found: error

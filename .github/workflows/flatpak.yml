name: Flatpak

# Builds, installs and smoke-tests the Flatpak on x86_64 and aarch64 (native runners, no
# emulation). Called by CI and by the release workflow; publishes nothing.
on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the binary
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Embed the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in (*[!0-9A-Za-z.+-]*|'') echo "bad version: $VERSION"; exit 1;; esac
          sed -i "s/^    IPMI_CONNECT_VERSION: .*/    IPMI_CONNECT_VERSION: ${VERSION}/" packaging/flatpak/io.github.a5m0.IPMIConnect.yml
      # flatpak-builder runs directly rather than through flatpak-github-actions, which updates
      # the runtimes preinstalled in the image's system installation; on x86_64 that update
      # fails ("Invalid cross-device link", a rename across the container's overlay layers).
      # A fresh user installation of the pinned runtime branch avoids touching those layers.
      - name: Install the SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --arch=${{ matrix.arch }} flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51 org.freedesktop.Sdk.Extension.golang//26.08
      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean --arch=${{ matrix.arch }} \
            --repo=repo build-dir packaging/flatpak/io.github.a5m0.IPMIConnect.yml
          flatpak build-bundle --arch=${{ matrix.arch }} --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo ipmi-connect_${{ inputs.version }}_linux_${{ matrix.arch }}.flatpak io.github.a5m0.IPMIConnect
      - name: Install and smoke test
        run: |
          flatpak install --user -y --noninteractive --bundle ipmi-connect_${{ inputs.version }}_linux_${{ matrix.arch }}.flatpak
          mkdir -p /run/dbus && (dbus-daemon --system --fork || true)
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- packaging/flatpak/smoke-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: ipmi-connect_${{ inputs.version }}_linux_${{ matrix.arch }}.flatpak
          if-no-files-found: error

# Flatpak manifest for ipmi-connect. Builds the Go executable with its native window from this
# checkout, offline: Go modules come from go-modules.json (pinned by SHA-256, generated by
# gen-sources), and the Go toolchain from the Freedesktop SDK's golang extension. Nothing else is
# downloaded. The window uses GTK4 and WebKitGTK 6.0 from the GNOME runtime, loaded at run time
# (Wails' purego backend), so the build still needs no C compiler.
#
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.a5m0.IPMIConnect.yml
#
# See README.md in this folder for permissions and the remaining sandbox limitations.
id: io.github.a5m0.IPMIConnect
# GNOME 51 is built on Freedesktop 26.08, so the 26.08 golang extension applies.
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ipmi-connect

finish-args:
  # Reach the BMCs. This shares the host network: Flatpak cannot limit it to one BMC. The
  # application restricts its own connections to the chosen BMC; see README.md.
  - --share=network
  # The console window: Wayland, with X11 only where there is no Wayland, and the GPU for
  # WebKit's compositing. --share=ipc is X11's shared memory, which GTK needs under X11.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Nothing else. No filesystem access (images come from the FileChooser portal or the private
  # media folder, screenshots go through the portal's Save dialog), no other devices, no D-Bus
  # names beyond the portals every Flatpak may use. WebKit runs its web process in its own
  # nested sandbox.

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    CGO_ENABLED: '0'
    GOFLAGS: -mod=vendor -trimpath
    GOTOOLCHAIN: local
    GOPROXY: 'off'
    GONOSUMDB: '*'
    GOCACHE: /run/build/ipmi-connect/.gocache
    GOPATH: /run/build/ipmi-connect/.gopath
    # Overridden by the release workflow.
    IPMI_CONNECT_VERSION: 0.2.0+flatpak

modules:
  - name: ipmi-connect
    buildsystem: simple
    build-commands:
      - go version
      - go build -tags desktop,purego,production -ldflags "-s -w -X main.version=${IPMI_CONNECT_VERSION}" -o ipmi-connect ./cmd/ipmi-connect
      - install -Dm755 ipmi-connect /app/bin/ipmi-connect
      - install -Dm644 packaging/flatpak/io.github.a5m0.IPMIConnect.desktop /app/share/applications/io.github.a5m0.IPMIConnect.desktop
      - install -Dm644 packaging/flatpak/io.github.a5m0.IPMIConnect.metainfo.xml /app/share/metainfo/io.github.a5m0.IPMIConnect.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.a5m0.IPMIConnect.svg /app/share/icons/hicolor/scalable/apps/io.github.a5m0.IPMIConnect.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.a5m0.IPMIConnect/LICENSE
      - install -Dm644 NOTICE /app/share/licenses/io.github.a5m0.IPMIConnect/NOTICE
      - install -Dm644 internal/aspeed/LICENSE /app/share/licenses/io.github.a5m0.IPMIConnect/LICENSE.aspeed-MPL-2.0
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .claude
          - bin
          - dist
          - vendor
          - build-dir
          - .flatpak-builder
          - repo
      - go-modules.json

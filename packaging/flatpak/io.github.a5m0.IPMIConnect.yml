# Flatpak manifest for ipmi-connect. Builds the static Go executable from this checkout, offline:
# Go modules come from go-modules.json (pinned by SHA-256, generated by gen-sources), and the Go
# toolchain from the Freedesktop SDK's golang extension. Nothing else is downloaded.
#
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.a5m0.IPMIConnect.yml
#
# See README.md in this folder for permissions and the remaining sandbox limitations.
id: io.github.a5m0.IPMIConnect
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: ipmi-connect

finish-args:
  # Reach the BMCs, and let the user's browser (outside the sandbox) reach the console on
  # 127.0.0.1. This shares the host network: Flatpak cannot limit it to one BMC. The application
  # restricts its own connections to the chosen BMC; see README.md.
  - --share=network
  # Nothing else. No filesystem access (images come from the FileChooser portal or the private
  # media folder), no display server (the UI is the user's browser, opened via the OpenURI
  # portal), no devices, no D-Bus names beyond the portals every Flatpak may use.

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    CGO_ENABLED: '0'
    GOFLAGS: -mod=vendor -trimpath
    GOTOOLCHAIN: local
    GOPROXY: 'off'
    GONOSUMDB: '*'
    GOCACHE: /run/build/ipmi-connect/.gocache
    GOPATH: /run/build/ipmi-connect/.gopath
    # Overridden by the release workflow.
    IPMI_CONNECT_VERSION: 0.2.0+flatpak

modules:
  - name: ipmi-connect
    buildsystem: simple
    build-commands:
      - go version
      - go build -ldflags "-s -w -X main.version=${IPMI_CONNECT_VERSION}" -o ipmi-connect ./cmd/ipmi-connect
      - install -Dm755 ipmi-connect /app/bin/ipmi-connect
      - install -Dm644 packaging/flatpak/io.github.a5m0.IPMIConnect.desktop /app/share/applications/io.github.a5m0.IPMIConnect.desktop
      - install -Dm644 packaging/flatpak/io.github.a5m0.IPMIConnect.metainfo.xml /app/share/metainfo/io.github.a5m0.IPMIConnect.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.a5m0.IPMIConnect.svg /app/share/icons/hicolor/scalable/apps/io.github.a5m0.IPMIConnect.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.a5m0.IPMIConnect/LICENSE
      - install -Dm644 NOTICE /app/share/licenses/io.github.a5m0.IPMIConnect/NOTICE
      - install -Dm644 internal/aspeed/LICENSE /app/share/licenses/io.github.a5m0.IPMIConnect/LICENSE.aspeed-MPL-2.0
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .claude
          - bin
          - dist
          - vendor
          - build-dir
          - .flatpak-builder
          - repo
      - go-modules.json
